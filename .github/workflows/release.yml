# BYK Seri Baskı Pro — Mac + Windows kurulum paketleri
#
# Kullanım:
#   1) GitHub'a push et
#   2) Sürüm etiketi at:  git tag v1.1.1 && git push origin v1.1.1
#   3) Actions build eder → Releases sayfasında zip'ler indirilebilir
#
# Manuel: Actions → "Release packages" → Run workflow

name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bağımlılıklar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: İkonlar
        shell: bash
        run: python tools/prepare_icons.py

      - name: Uygulama (exe)
        shell: bash
        run: python -m PyInstaller --noconfirm BYKSeriBaskiPro.spec

      - name: payload.zip
        shell: pwsh
        run: |
          if (Test-Path payload.zip) { Remove-Item payload.zip -Force }
          Compress-Archive -Path 'dist\BYKSeriBaskiPro\*' -DestinationPath 'payload.zip' -Force

      - name: Kurulum.exe
        shell: bash
        run: python -m PyInstaller --noconfirm Kurulum.spec

      - name: Release zip'leri
        shell: pwsh
        env:
          VER: ${{ needs.version.outputs.ver }}
        run: |
          $ver = $env:VER
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $out = "release\BYKSeriBaskiPro_v${ver}_Kurulum"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "dist\BYKSeriBaskiPro_Kurulum.exe" "$out\BYKSeriBaskiPro_Kurulum.exe"
          Copy-Item "DAGITIM.txt" "$out\OKU_BENI.txt"
          Copy-Item "VERSION" "$out\VERSION.txt"
          Compress-Archive -Path "$out\*" -DestinationPath "release\BYKSeriBaskiPro_v${ver}_Kurulum.zip" -Force
          Compress-Archive -Path 'dist\BYKSeriBaskiPro\*' -DestinationPath "release\BYKSeriBaskiPro_v${ver}_Portable.zip" -Force
          # Sabit adlar → releases/latest/download/... (site butonları)
          Copy-Item "release\BYKSeriBaskiPro_v${ver}_Kurulum.zip" "release\BYKSeriBaskiPro_Kurulum.zip" -Force
          Copy-Item "release\BYKSeriBaskiPro_v${ver}_Portable.zip" "release\BYKSeriBaskiPro_Portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/BYKSeriBaskiPro_v*_Kurulum.zip
            release/BYKSeriBaskiPro_v*_Portable.zip
            release/BYKSeriBaskiPro_Kurulum.zip
            release/BYKSeriBaskiPro_Portable.zip
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bağımlılıklar
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller

      - name: Mac .app + zip
        run: |
          chmod +x BASLAT.sh BUILD_APP.sh BUILD_RELEASE_MAC.sh KURULUM.sh KALDIR.sh *.command
          ./BUILD_RELEASE_MAC.sh
          VER="$(tr -d '[:space:]' < VERSION)"
          cp "release/BYKSeriBaskiPro_v${VER}_macOS.zip" "release/BYKSeriBaskiPro_macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            release/BYKSeriBaskiPro_v*_macOS.zip
            release/BYKSeriBaskiPro_macOS.zip
          if-no-files-found: error

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Dosyaları düzle + sabit latest adları
        env:
          VER: ${{ needs.version.outputs.ver }}
        run: |
          mkdir -p dist-upload
          find artifacts -type f \( -name '*.zip' \) -exec cp {} dist-upload/ \;
          # Güvence: sürüm zip’lerinden sabit ad üret
          cp -f "dist-upload/BYKSeriBaskiPro_v${VER}_Kurulum.zip" "dist-upload/BYKSeriBaskiPro_Kurulum.zip"
          cp -f "dist-upload/BYKSeriBaskiPro_v${VER}_Portable.zip" "dist-upload/BYKSeriBaskiPro_Portable.zip"
          cp -f "dist-upload/BYKSeriBaskiPro_v${VER}_macOS.zip" "dist-upload/BYKSeriBaskiPro_macOS.zip"
          ls -la dist-upload

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: BYK Seri Baskı Pro ${{ needs.version.outputs.ver }}
          make_latest: true
          body: |
            ## İndirme (yalnızca kurulum paketleri)

            Kaynak kodu son kullanıcıyla paylaşmayın. Releases sayfasındaki
            “Source code” linklerini siteye koymayın — yalnız aşağıdaki zip’ler.

            | Platform | Kalıcı link |
            |---|---|
            | **Windows** | https://github.com/metinfarukbiyik/bykseripro/releases/latest/download/BYKSeriBaskiPro_Kurulum.zip |
            | **macOS** | https://github.com/metinfarukbiyik/bykseripro/releases/latest/download/BYKSeriBaskiPro_macOS.zip |
            | Windows taşınabilir | https://github.com/metinfarukbiyik/bykseripro/releases/latest/download/BYKSeriBaskiPro_Portable.zip |

            Windows: zip’i aç → `BYKSeriBaskiPro_Kurulum.exe`  
            macOS: zip’i aç → `BYKSeriBaskiPro.app` (ilk açılışta sağ tık → Aç)

            Sürüm: ${{ needs.version.outputs.ver }}
          files: |
            dist-upload/BYKSeriBaskiPro_Kurulum.zip
            dist-upload/BYKSeriBaskiPro_macOS.zip
            dist-upload/BYKSeriBaskiPro_Portable.zip
            dist-upload/BYKSeriBaskiPro_v${{ needs.version.outputs.ver }}_Kurulum.zip
            dist-upload/BYKSeriBaskiPro_v${{ needs.version.outputs.ver }}_macOS.zip
            dist-upload/BYKSeriBaskiPro_v${{ needs.version.outputs.ver }}_Portable.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: all-packages
          path: dist-upload/*
